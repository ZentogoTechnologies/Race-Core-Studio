# Construye el instalador de verdad: rcs-setup.exe con interfaz de Inno
# Setup y todo el producto ya compilado dentro.
#
# La diferencia con el flujo viejo es dónde se compila. Antes el .exe era
# un guion que clonaba el repositorio en la máquina del cliente y
# compilaba allí: veinte minutos, una terminal y una carpeta con el
# proyecto entero. Aquí se compila en esta máquina, y el cliente recibe
# el resultado.

name: Instalador con interfaz

on:
  push:
    branches: [test-production-1.0, main]
    paths:
      - 'installer/**'
      - 'launcher/**'
      - 'Backend/**'
      - 'Frontend/**'
      - 'Casparcg/template/**'
      - 'VERSION'
      - '.github/workflows/instalador-inno.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # La de MongoDB que se empaqueta. Fijada a propósito: que la versión de
  # la base de datos cambie sola entre dos compilaciones es justo lo que
  # no se quiere en un producto que se instala en sitios sin soporte.
  MONGO_VERSION: 7.0.14

jobs:
  construir:
    runs-on: windows-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v4
        with:
          # Con LFS: aquí sí hacen falta los binarios de CasparCG, que
          # viajan dentro del paquete.
          lfs: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar que la versión cuadra en todas partes
        run: python tools/version.py

      - name: Revisar lo que no ve el compilador
        run: |
          python tools/revisar.py
          pip install pyflakes

          # Los archivos se listan con Get-ChildItem y no con comodines:
          # PowerShell no los expande para un programa externo, se los
          # pasa tal cual, y pyflakes contesta «Invalid argument».
          $archivos = Get-ChildItem -Recurse -Filter *.py -Path launcher,Backend,installer |
            Where-Object { $_.FullName -notmatch '\\(venv|tests|__pycache__|build|dist)\\' } |
            ForEach-Object { $_.FullName }

          Write-Host "Revisando $($archivos.Count) archivos"
          $salida = & python -m pyflakes $archivos 2>&1

          # pyflakes sale con 1 en cuanto dice algo, incluidos los avisos
          # que aquí no importan. Manda lo que queda tras filtrarlos, no
          # su código de salida.
          $global:LASTEXITCODE = 0

          $graves = $salida | Where-Object {
            $_ -notmatch 'imported but unused|unable to detect undefined|redefinition of unused'
          }
          if ($graves) {
            $graves | ForEach-Object { Write-Host $_ }
            throw "Revisa lo de arriba antes de publicar"
          }
          Write-Host "Sin nombres indefinidos."

      - name: Dependencias del backend
        run: |
          python -m pip install --upgrade pip
          # Sin rembg: son 200 MB de onnxruntime para recortar fondos de
          # fotos, y se importa solo al usarlo.
          Get-Content Backend/requirements.txt |
            Where-Object { $_ -notmatch '^\s*(#|$)' -and $_ -notmatch 'rembg' } |
            Set-Content requisitos-sin-rembg.txt
          pip install -r requisitos-sin-rembg.txt
          pip install pyinstaller

      - name: Compilar el panel
        working-directory: Frontend
        run: |
          npm ci
          npm run build

      - name: Congelar el backend
        run: pyinstaller Backend/backend.spec --noconfirm --clean --distpath dist-backend

      - name: Congelar el lanzador
        run: |
          # --windowed y no --console: es lo que hacia aparecer la
          # ventana negra. Ahora abre su panel.
          pyinstaller --onefile --windowed --clean --noconfirm --noupx `
            --name race-core-studio `
            --icon launcher/race-core-studio.ico `
            --version-file launcher/version-info.txt `
            --hidden-import pymongo `
            --hidden-import panel `
            --paths launcher `
            --add-data "VERSION;." `
            --distpath dist-launcher `
            launcher/race_core_studio.py

      - name: Comprobar el panel del lanzador
        run: |
          # Se importa con el tkinter de verdad, sin abrir ventana. Es lo
          # que atrapa un nombre mal escrito o un tkinter que no entro en
          # el .exe: un panel roto solo se veria al ejecutarlo, y para
          # entonces ya esta en el equipo del cliente.
          python -c "import sys; sys.path.insert(0,'launcher'); import tkinter, panel; print('panel:', len(panel.ESTADOS), 'estados')"

      - name: Bajar MongoDB
        run: |
          $url = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$env:MONGO_VERSION.zip"
          Write-Host "Bajando $url"
          Invoke-WebRequest -Uri $url -OutFile mongo.zip
          Expand-Archive mongo.zip -DestinationPath mongo-tmp

      - name: Armar el paquete
        run: |
          New-Item -ItemType Directory -Force -Path payload | Out-Null

          # El programa
          # Carpeta y no archivo suelto: PyInstaller reparte ahi las
          # bibliotecas, y asi el backend no tiene que descomprimirse
          # entero en cada arranque.
          Copy-Item dist-backend/race-core-backend payload/backend -Recurse
          Copy-Item dist-launcher/race-core-studio.exe  payload/
          Copy-Item VERSION                             payload/

          # El panel ya compilado
          Copy-Item Frontend/dist payload/panel -Recurse

          # CasparCG
          Copy-Item Casparcg payload/casparcg -Recurse

          # Sus rutas, resueltas aqui y no en el equipo del cliente.
          #
          # El config del repositorio las declara relativas —media/, log/,
          # data/, template/— porque alli CasparCG vive en la carpeta del
          # proyecto, donde se puede escribir. Instalado en «Archivos de
          # programa» no puede, y se niega a arrancar:
          #
          #     Failed to create directory media/ (Acceso denegado)
          #
          # Se dejan apuntando a ProgramData, que es fijo en Windows y no
          # depende de donde el cliente decida instalar. Hacerlo aqui y no
          # con codigo Pascal en el instalador quita una pieza que solo se
          # podia probar instalando.
          $datos = 'C:\ProgramData\Race Core Studio'
          $cfg = 'payload/casparcg/casparcg.config'
          $texto = Get-Content $cfg -Raw

          $texto = $texto.Replace('<media-path>media/</media-path>',
                                  "<media-path>$datos\casparcg\media\</media-path>")
          $texto = $texto.Replace('<log-path disable="false">log/</log-path>',
                                  "<log-path disable=""false"">$datos\casparcg\log\</log-path>")
          $texto = $texto.Replace('<data-path>data/</data-path>',
                                  "<data-path>$datos\casparcg\data\</data-path>")
          $texto = $texto.Replace('<template-path>template/</template-path>',
                                  "<template-path>$datos\plantillas\</template-path>")

          # CEF —el navegador con el que CasparCG pinta los graficos—
          # guarda su cache junto al ejecutable si no se le dice otra
          # cosa. El config trae la opcion documentada pero fuera de la
          # configuracion activa, o sea sin efecto.
          $html = "    <html>`r`n        <cache-path>$datos\casparcg\cef-cache\</cache-path>`r`n    </html>`r`n</configuration>"
          $texto = $texto.Replace('</configuration>', $html)

          Set-Content $cfg -Value $texto -NoNewline

          Write-Host "`n=== Rutas de CasparCG ==="
          Select-String -Path $cfg -Pattern '-path' | ForEach-Object { $_.Line.Trim() }

          # Que no quede ninguna relativa sin resolver.
          $sueltas = Select-String -Path $cfg -Pattern '<(media|log|data|template)-path[^>]*>(media|log|data|template)/<'
          if ($sueltas) { throw "Quedaron rutas relativas en casparcg.config" }

          # MongoDB: solo lo que hace falta para servir. Las herramientas
          # de línea de órdenes y Compass no pintan nada en un autódromo.
          New-Item -ItemType Directory -Force -Path payload/mongodb/bin | Out-Null
          $origen = (Get-ChildItem mongo-tmp -Directory | Select-Object -First 1).FullName
          Copy-Item "$origen/bin/mongod.exe" payload/mongodb/bin/
          if (Test-Path "$origen/bin/mongod.cfg") {
            Copy-Item "$origen/bin/mongod.cfg" payload/mongodb/bin/
          }

          Write-Host "`n=== El paquete ==="
          if (-not (Test-Path payload/backend/race-core-backend.exe)) {
            throw "Falta el backend en el paquete"
          }
          Get-ChildItem payload | Format-Table Name, Length
          "{0:N0} MB en total" -f ((Get-ChildItem payload -Recurse |
            Measure-Object Length -Sum).Sum / 1MB)

      - name: Comprobar que el backend congelado arranca
        run: |
          # No instala nada: solo obliga a cargar todos los módulos. Si a
          # PyInstaller le faltó alguno, se ve aquí y no en un autódromo.
          $p = Start-Process payload/backend/race-core-backend.exe -PassThru `
                 -RedirectStandardOutput arranque.log -RedirectStandardError arranque.err
          Start-Sleep -Seconds 25
          $vivo = -not $p.HasExited
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "--- salida ---"; Get-Content arranque.log, arranque.err -EA SilentlyContinue
          # Sin MongoDB detrás no llega a servir, pero sí tiene que pasar
          # de las importaciones. Morir antes de eso es un módulo que falta.
          if (-not $vivo) {
            $texto = (Get-Content arranque.log, arranque.err -Raw -EA SilentlyContinue)
            if ($texto -match "ModuleNotFoundError|ImportError") {
              throw "Al backend congelado le falta un módulo. Ver arriba."
            }
          }

      - name: Comprobar que el instalador no apunta al vacío
        run: |
          # Ahora que el paquete existe, se comprueba que cada archivo
          # que el instalador ejecuta esté de verdad dentro. Inno no lo
          # sabe —no puede saber qué habrá en {app} cuando alguien
          # instale— y el fallo sale en el equipo del cliente, a mitad
          # de la instalación y con 250 MB ya copiados.
          python tools/revisar.py

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\inno\race-core-studio.iss
          Get-ChildItem dist

      - name: Huella
        id: huella
        run: |
          $h = (Get-FileHash dist/rcs-setup.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $h"

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: rcs-setup
          path: dist/rcs-setup.exe

      - name: Publicar la descarga
        if: github.ref == 'refs/heads/test-production-1.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: instalador
          name: Race Core Studio — instalador
          body: |
            **rcs-setup.exe** — instalador de Race Core Studio.

            Asistente con interfaz. Instala el programa ya compilado:
            no descarga código ni compila nada en el equipo.

            Incluye CasparCG y MongoDB. No hacen falta Python, Node ni
            Git.

            Los datos del autódromo se guardan en
            `C:\ProgramData\Race Core Studio`, aparte del programa, para
            que actualizar o reinstalar no los toque.

            ### Antivirus

            El ejecutable **no va firmado** todavía: Windows lo marcará
            como «editor desconocido» y Defender puede llegar a borrarlo
            con `Trojan:Win32/Wacatac.B!ml`. El sufijo `!ml` significa
            que no coincide con ningún malware conocido — es el modelo
            heurístico puntuando un binario sin firma. Se arregla de
            verdad con un certificado Authenticode.

            Se compila en un runner limpio de GitHub desde el código de
            este repositorio, y su huella es comprobable:

            ```
            SHA-256  ${{ steps.huella.outputs.sha256 }}
            ```

            ```powershell
            Get-FileHash rcs-setup.exe -Algorithm SHA256
            ```

            Compilado desde `${{ github.sha }}`.
          files: dist/rcs-setup.exe
          prerelease: true
          make_latest: false
