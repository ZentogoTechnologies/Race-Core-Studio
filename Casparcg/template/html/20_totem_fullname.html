<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/totem_names.css">
</head>
<body>

<div class="leaderboard" id="leaderboard">

    <!-- HEADER -->
    <div class="lb-header">

        <div class="lb-logo">
            <img src="../img/logoap.png" alt="Autódromo Panamá">
        </div>

        <div class="lb-info">

            <!-- GRUPO / CATEGORIA -->
            <div
                class="lb-group"
                id="groupName">
                PROSPEC SERIES
            </div>

            <div class="lb-heat" id="heatName">
                HEAT 1
            </div>

            <div class="lb-timer">
                <span id="timerLabel">TIME</span>
                <span id="raceTimer">00:01:51</span>
            </div>

        </div>

    </div>

    <!-- TABLA -->
    <div class="lb-body" id="leaderboardBody">

    </div>

</div>

<script src="../js/timing.js"></script>
<script>

/* ==========================================================================
   TOTEM NOMBRE COMPLETO

   Posicion tal cual la manda MyLaps, inicial del nombre + apellido, y el
   numero del carro. Los datos llegan del backend, que ya cruzo el numero
   contra la base para sacar el nombre bien escrito.
========================================================================== */

const container = document.getElementById("leaderboardBody");

const LIMITE = 10;

let firmaAnterior = null;


function pintarFilas(standings){
    /* Antes de arrancar la tanda no hay clasificacion. Se deja solo la
       cabecera con la cuenta atras: mejor eso que una tabla vacia
       colgando o, peor, las posiciones de la tanda anterior. */

    if (standings.length === 0) {
        container.innerHTML = "";
        return;
    }


    /* Solo se rehace la tabla si cambio algo: el bucle corre dos veces por
       segundo y reconstruir el DOM cada vez hace parpadear el totem. */

    const firma = timingFirma(standings, ["position", "short_name", "number"]);
    if (firma === firmaAnterior) return;
    firmaAnterior = firma;

    container.innerHTML = "";

    standings.forEach((piloto, index) => {

        const row = document.createElement("div");

        row.className = index === 0 ? "lb-row leader" : "lb-row";

        row.innerHTML = `

            <div class="lb-pos pos-${piloto.position}">
                ${piloto.position}
            </div>

            <div class="lb-separator"></div>

            <div class="lb-name">
                ${piloto.short_name}
            </div>

            <div class="lb-number">
                ${piloto.number}
            </div>

        `;

        container.appendChild(row);
    });
}


function pintarCabecera(datos){

    /* La categoria de la tanda, encima del heat. */

    const grupo = document.getElementById("groupName");
    if (grupo) grupo.textContent = datos.group_name || datos.group || "";


    /* HEAT-3 / QUALY-1 / PRACTICE-2, calculado por el backend a partir
       del runtype y el runname de MyLaps. */

    const heat = document.getElementById("heatName");
    if (heat) heat.textContent = datos.heat || "";

    /* MyLaps refresca racetime constantemente. */

    /* La etiqueta cambia con el modo: TIME en cuenta atras, LAP cuando
       se cuentan vueltas. */

    const etiqueta = document.getElementById("timerLabel");
    if (etiqueta) etiqueta.textContent = datos.time_label || "TIME";

    const timer = document.getElementById("raceTimer");
    if (timer) timer.textContent = datos.time || "";
}


function pintar(datos){
    pintarCabecera(datos);
    pintarFilas(datos.standings || []);
}


/* ==========================================================================
   PLAY / STOP
========================================================================== */

function play(){

    const widget = document.getElementById("leaderboard");

    widget.style.animation = "slideUp .5s ease forwards";

    setTimeout(() => {
        widget.style.animation = "expandPanel .6s ease forwards";
    },500);

    arrancarTiming({ limite: LIMITE, alRecibir: pintar });
}


function stop(){

    detenerTiming();

    const widget = document.getElementById("leaderboard");

    widget.style.animation = "collapsePanel .5s ease forwards";

    setTimeout(() => {
        widget.style.animation = "slideDown .5s ease forwards";
    },500);
}


/* ==========================================================================
   UPDATE

   Este totem se alimenta solo del current.xml, asi que update() solo
   sirve para apuntar a otro backend o cambiar el logo.
========================================================================== */

function update(data){

    if (typeof data === "string") {
        try { data = JSON.parse(data); }
        catch (e) { return; }
    }

    if (!data) return;

    if (data.api !== undefined) configurarTiming(data.api);

    if (data.logo !== undefined) {
        const logo = document.getElementById("logo");
        if (logo) logo.src = data.logo;
    }
}


window.onload = play;
</script>

</body>
</html>
