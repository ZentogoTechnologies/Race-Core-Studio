<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Totem Nombre Completo</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/totem_torre.css">
</head>
<body>

<div class="tf-torre" id="torre">

    <div class="tf-cabecera">

        <div class="tf-logo">
            <img src="../img/logo-cliente.png" alt="Autódromo Panamá">
        </div>

        <div class="tf-info">
            <div class="tf-grupo" id="grupo">STREET LEGAL</div>
            <div class="tf-sub">
                <span class="tf-heat" id="heat">HEAT 1</span>
                <span class="tf-reloj">
                    <span class="tf-reloj-etiqueta" id="relojEtiqueta">TIME</span><span id="reloj">0:00</span>
                </span>
            </div>
        </div>

    </div>

    <div class="tf-estado" id="estado"></div>

    <div class="tf-cuerpo" id="cuerpo"></div>

</div>

<script src="../js/timing.js"></script>
<script src="../js/torre.js"></script>
<script>

/* ==========================================================================
   TÓTEM NOMBRE COMPLETO

   Entra con el nombre completo y a los seis segundos se abrevia solo:
   las letras que sobran pierden el ancho y las que quedan se corren
   hacia la izquierda. Es el tótem con el que se presenta a la gente.

   Todo lo común a los cuatro tótems vive en js/torre.js. Aquí solo se
   declara en qué se diferencia este.
========================================================================== */


function play(){

    arrancarTorre({
        limite: 20,

        /* Segundos de nombre completo antes de encogerse. Da tiempo a
           leerlos y después deja de tapar la carrera. */
        retraso: 7,

        marca: true,
    });
}


function stop(){

    detenerTorre();
}


function update(data){

    actualizarTorre(data);
}


/* Fuera de CasparCG (abriendo el html a mano) no hay play(), así que se
   arranca solo para poder verlo en el navegador. */
if (!window.__casparcg) {
    play();
}

</script>

</body>
</html>
