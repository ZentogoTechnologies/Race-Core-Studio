<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Totem Nombre Completo</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/totem_fullname.css">
</head>
<body>

<div class="tf-torre" id="torre">

    <div class="tf-cabecera">

        <div class="tf-logo">
            <img src="../img/logoap.png" alt="Autódromo Panamá">
        </div>

        <div class="tf-info">
            <div class="tf-grupo" id="grupo">STREET LEGAL</div>
            <div class="tf-sub">
                <span class="tf-heat" id="heat">HEAT 1</span>
                <span class="tf-reloj">
                    <span class="tf-reloj-etiqueta" id="relojEtiqueta">TIME</span><span id="reloj">0:00</span>
                </span>
            </div>
        </div>

    </div>

    <div class="tf-estado" id="estado"></div>

    <div class="tf-cuerpo" id="cuerpo"></div>

</div>

<script src="../js/timing.js"></script>
<script>

/* ==========================================================================
   TÓTEM NOMBRE COMPLETO

   Torre vertical con la posición, el logo de la marca del carro y el
   nombre completo del piloto. Los datos llegan del backend, que ya cruzó
   el dorsal contra la base para sacar el nombre bien escrito y la marca.

   La lógica de consulta no cambió respecto a la versión anterior: lo que
   se rehízo es cómo se ve.
========================================================================== */

const cuerpo = document.getElementById("cuerpo");
const torre  = document.getElementById("torre");

/* Cuántas posiciones caben. CasparCG puede cambiarlo con
   CG ... UPDATE 1 "{\"limite\":15}" */
let LIMITE = 20;

let firmaAnterior = null;


/* Las banderas de MyLaps al color de la banda superior. */
const BANDERAS = {
    red:        { clase: "roja",     texto: "BANDERA ROJA · SESIÓN DETENIDA" },
    yellow:     { clase: "amarilla", texto: "BANDERA AMARILLA" },
    green:      { clase: "verde",    texto: "PISTA VERDE" },
    white:      { clase: "blanca",   texto: "ÚLTIMA VUELTA" },
    checkered:  { clase: "cuadros",  texto: "BANDERA A CUADROS" },
    finish:     { clase: "cuadros",  texto: "FIN DE CARRERA" },
};


function escapar(texto){

    /* Los nombres salen de la base y del XML de MyLaps. Un apellido con
       un & o un < romperia el innerHTML de la fila. */

    return String(texto == null ? "" : texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}


function pintarFilas(standings){

    /* Se redibuja solo si cambio algo. Repintar diez veces por segundo
       hace parpadear los logos, que son peticiones al backend. */

    const firma = timingFirma(standings, ["position", "full_name", "number", "brand_logo", "is_best_lap"]);
    if (firma === firmaAnterior) return;
    firmaAnterior = firma;

    cuerpo.innerHTML = "";

    standings.forEach((piloto, index) => {

        const fila = document.createElement("div");
        const clases = ["tf-fila"];
        if (index === 0) clases.push("lider");
        // El backend marca quien tiene la vuelta rapida comparando el
        // dorsal de la cabecera del XML con el de cada fila.
        if (piloto.is_best_lap) clases.push("vuelta-rapida");

        fila.className = clases.join(" ");

        /* Sin logo se deja el hueco vacio en vez de un roto: la columna
           tiene que seguir alineada aunque falte una marca. */
        const logo = piloto.brand_logo
            ? `<img src="${escapar(piloto.brand_logo)}" alt="${escapar(piloto.brand || "")}">`
            : "";

        fila.innerHTML = `
            <div class="tf-pos">${escapar(piloto.position)}</div>
            <div class="tf-barra"></div>
            <div class="tf-marca">${logo}</div>
            <div class="tf-nombre">${escapar(piloto.full_name)}</div>
            <div class="tf-dorsal">${escapar(piloto.number)}</div>
        `;

        cuerpo.appendChild(fila);
    });
}


function pintarCabecera(datos){

    const grupo = document.getElementById("grupo");
    if (grupo) grupo.textContent = datos.group_name || datos.group || "";

    const heat = document.getElementById("heat");
    if (heat) heat.textContent = datos.heat || datos.run_name || "";

    /* El backend decide si manda el reloj de carrera o la cuenta atras, y
       manda tambien la etiqueta que corresponde. */
    const etiqueta = document.getElementById("relojEtiqueta");
    if (etiqueta) etiqueta.textContent = datos.time_label || "TIME";

    const reloj = document.getElementById("reloj");
    if (reloj) reloj.textContent = datos.time || "0:00";

    /* Banda de estado: solo cuando hay bandera. */
    const estado = document.getElementById("estado");
    const bandera = BANDERAS[(datos.flag || "none").toLowerCase()];

    if (estado && bandera) {
        estado.className = "tf-estado " + bandera.clase;
        estado.textContent = bandera.texto;
        torre.classList.add("con-estado");
    } else {
        torre.classList.remove("con-estado");
    }
}


function pintar(datos){

    if (!datos) return;

    pintarCabecera(datos);
    pintarFilas(datos.standings || []);
}


/* ─── Ciclo de vida de CasparCG ─────────────────────────────── */

function play(){

    arrancarTiming({ limite: LIMITE, alRecibir: pintar });
}


function stop(){

    detenerTiming();
}


function update(data){

    /* Acepta {"limite":15} y {"api":"http://otra-maquina:8080/api/v1"} */

    try {
        const d = typeof data === "string" ? JSON.parse(data) : (data || {});

        if (d.api) configurarTiming(d.api);

        if (d.limite) {
            LIMITE = parseInt(d.limite, 10) || LIMITE;
            firmaAnterior = null;          // fuerza el repintado
            arrancarTiming({ limite: LIMITE, alRecibir: pintar });
        }
    } catch (e) {
        /* Un UPDATE con basura no puede tumbar el grafico al aire. */
    }
}


/* Fuera de CasparCG (abriendo el html a mano) no hay play(), asi que se
   arranca solo para poder verlo en el navegador. */
if (!window.__casparcg) {
    play();
}

</script>

</body>
</html>
