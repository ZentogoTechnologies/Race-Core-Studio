<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Totem al Líder</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/totem_torre.css">
</head>
<body>

<div class="tf-torre" id="torre">

    <div class="tf-cabecera">

        <div class="tf-logo">
            <img src="../img/logoap.png" alt="Autódromo Panamá">
        </div>

        <div class="tf-info">
            <div class="tf-grupo" id="grupo">STREET LEGAL</div>
            <div class="tf-sub">
                <span class="tf-heat" id="heat">HEAT 1</span>
                <span class="tf-reloj">
                    <span class="tf-reloj-etiqueta" id="relojEtiqueta">TIME</span><span id="reloj">0:00</span>
                </span>
            </div>
        </div>

    </div>

    <div class="tf-estado" id="estado"></div>

    <div class="tf-cuerpo" id="cuerpo"></div>

</div>

<script src="../js/timing.js"></script>
<script src="../js/torre.js"></script>
<script>

/* ==========================================================================
   TÓTEM AL LÍDER

   Cuánto le saca el primero a cada uno. La columna de la derecha lleva
   la diferencia contra el líder, y en la fila del primero dice a qué
   diferencia se refiere en vez de una cifra contra sí mismo.

   Todo lo común a los cuatro tótems vive en js/torre.js. Aquí solo se
   declara en qué se diferencia este.
========================================================================== */


function play(){

    arrancarTorre({
        limite: 20,
        retraso: 0,

        columna: "leader",
        etiqueta: "LÍDER",

        /* El dorsal ocupa el sitio del logo: la columna de diferencia ya
           alarga la fila, y donde todos corren la misma marca el logo no
           distingue a nadie. */
        marca: false,
        dorsalIzquierda: true,
    });
}


function stop(){

    detenerTorre();
}


function update(data){

    actualizarTorre(data);
}


/* Fuera de CasparCG (abriendo el html a mano) no hay play(), así que se
   arranca solo para poder verlo en el navegador. */
if (!window.__casparcg) {
    play();
}

</script>

</body>
</html>
