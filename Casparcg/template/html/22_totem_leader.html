<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Totem Shortname Leader</title>

    <link rel="stylesheet" href="../css/totem_names.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/totem_leader.css">

</head>

<body>


<div class="leaderboard" id="leaderboard">


    <!-- ==============================================================
         HEADER
    ============================================================== -->

    <div class="lb-header">


        <!-- LOGO -->

        <div class="lb-logo">

            <img
                src="../img/logoap.png"
                alt="Autódromo Panamá">

        </div>


        <!-- INFORMACIÓN -->

        <div class="lb-info">


            <!-- GRUPO / CATEGORIA -->
            <div
                class="lb-group"
                id="groupName">
                PROSPEC SERIES
            </div>

            <div
                class="lb-heat"
                id="heatName">

                HEAT 1

            </div>


            <div class="lb-timer">

                <span id="timerLabel">TIME</span>

                <span id="raceTimer">
                    00:01:51
                </span>

            </div>


        </div>


    </div>



    <!-- ==============================================================
         TABLA
    ============================================================== -->

    <div
        class="lb-body"
        id="leaderboardBody">

    </div>


</div>



<script src="../js/timing.js"></script>
<script>


/* ==========================================================================
   DATOS DE PRUEBA
========================================================================== */

/* ==========================================================================
   TOTEM AL LIDER

   Misma tabla que el totem corto, con la columna de tiempo fija:
   la diferencia de cada piloto contra el primero.
   Los datos llegan del backend, que ya cruzo el numero de carro contra la
   base para sacar el nombre bien escrito.
========================================================================== */

const container = document.getElementById("leaderboardBody");

const LIMITE = 10;

/* "leader" = contra el primero, "interval" = contra el de adelante. */
const COLUMNA = "leader";

const ETIQUETA = "LEADER";

let firmaAnterior = null;


function textoTiempo(piloto, indice){

    /* El primero no tiene contra quien medirse. */
    if (indice === 0) return ETIQUETA;

    return piloto[COLUMNA] || "";
}


function pintarFilas(standings){

    /* Antes de arrancar la tanda no hay clasificacion: se deja solo la
       cabecera en vez de una tabla vacia o las posiciones anteriores. */

    if (standings.length === 0) {
        container.innerHTML = "";
        firmaAnterior = null;
        return;
    }

    /* El bucle corre dos veces por segundo: rehacer el DOM cada vez hace
       parpadear el totem. Solo se reconstruye si cambio el orden. */

    const firma = timingFirma(standings, ["position", "short_name", "number"]);
    if (firma === firmaAnterior) {
        actualizarTiempos(standings);
        return;
    }
    firmaAnterior = firma;

    container.innerHTML = "";

    standings.forEach((piloto, index) => {

        const row = document.createElement("div");

        row.className = index === 0 ? "lb-row leader" : "lb-row";

        row.innerHTML = `

            <div class="lb-pos pos-${piloto.position}">
                ${piloto.position}
            </div>

            <div class="lb-separator"></div>

            <div class="lb-name">
                ${piloto.short_name}
            </div>

            <div class="lb-number">
                ${piloto.number}
            </div>

            <div class="lb-interval">
                ${textoTiempo(piloto, index)}
            </div>

        `;

        container.appendChild(row);
    });
}


/* Solo el texto: los tiempos cambian a cada vuelta y no hace falta
   reconstruir las filas para eso. */

function actualizarTiempos(standings){

    const celdas = container.querySelectorAll(".lb-interval");

    standings.forEach((piloto, index) => {
        if (celdas[index]) celdas[index].textContent = textoTiempo(piloto, index);
    });
}


function pintarCabecera(datos){

    const grupo = document.getElementById("groupName");
    if (grupo) grupo.textContent = datos.group_name || datos.group || "";

    const heat = document.getElementById("heatName");
    if (heat) heat.textContent = datos.heat || "";

    /* La etiqueta cambia con el modo: TIME en cuenta atras, LAP cuando
       se cuentan vueltas. */

    const etiqueta = document.getElementById("timerLabel");
    if (etiqueta) etiqueta.textContent = datos.time_label || "TIME";

    const timer = document.getElementById("raceTimer");
    if (timer) timer.textContent = datos.time || "";
}


function pintar(datos){
    pintarCabecera(datos);
    pintarFilas(datos.standings || []);
}


/* ==========================================================================
   PLAY / STOP
========================================================================== */

function play(){

    const widget = document.getElementById("leaderboard");

    widget.style.animation = "slideUp .5s ease forwards";

    setTimeout(() => {
        widget.style.animation = "expandPanel .6s ease forwards";
    },500);

    arrancarTiming({ limite: LIMITE, alRecibir: pintar });
}


function stop(){

    detenerTiming();

    const widget = document.getElementById("leaderboard");

    widget.style.animation = "collapsePanel .5s ease forwards";

    setTimeout(() => {
        widget.style.animation = "slideDown .5s ease forwards";
    },500);
}


/* ==========================================================================
   UPDATE
========================================================================== */

function update(data){

    if (typeof data === "string") {
        try { data = JSON.parse(data); }
        catch (e) { return; }
    }

    if (!data) return;

    if (data.api !== undefined) configurarTiming(data.api);

    if (data.logo !== undefined) {
        const logo = document.getElementById("logo");
        if (logo) logo.src = data.logo;
    }
}


window.onload = play;
</script>


</body>

</html>
