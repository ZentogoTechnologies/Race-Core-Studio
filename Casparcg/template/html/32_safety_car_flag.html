<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Safety car</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/torre_medidas.css">
    <link rel="stylesheet" href="../css/banderas.css">
</head>
<body>

<div class="bandera-barra" id="barra">

    <div class="bandera-logo">
        <img src="../img/logo-cliente.png" alt="">
    </div>

    <div class="bandera-panel" id="panel">
        <div class="bandera-caja">
            <span class="trapo amarilla safety"><svg viewBox="0 0 48 22"><path d="M4 15h40M8 15c0-5 4-8 10-8h10c5 0 8 3 11 8" fill="none" stroke="#1a1a1a" stroke-width="2.4"/><circle cx="14" cy="16" r="3.2" fill="#1a1a1a"/><circle cx="34" cy="16" r="3.2" fill="#1a1a1a"/></svg></span>
            <span class="bandera-texto">
                <span class="bandera-nombre">Safety car</span>
                <span class="bandera-sentido">Coche de seguridad en pista</span>
            </span>
        </div>
    </div>

</div>

<script>

/* ==========================================================================
   SAFETY CAR

   Todas las banderas comparten esqueleto y hoja de estilo: lo único que
   cambia es el trapo que se dibuja y el texto. Antes cada una llevaba su
   propio panel de color con el nombre encima, sin el dibujo ni el
   significado.

   Miden lo mismo que la torre porque se dibujan sobre su cabecera: la
   medida sale de torre_medidas.css, que es de donde la toma el tótem.
========================================================================== */

function play(){
    document.getElementById("panel").classList.add("abierta");
}

function stop(){
    document.getElementById("panel").classList.remove("abierta");
}

function update(data){
    /* Se acepta cambiar el texto al vuelo, por si hace falta matizar algo
       en directo: {"sentido":"..."} */
    try {
        const d = typeof data === "string" ? JSON.parse(data) : (data || {});

        if (d.nombre)  document.querySelector(".bandera-nombre").textContent  = d.nombre;
        if (d.sentido) document.querySelector(".bandera-sentido").textContent = d.sentido;
    } catch (e) { /* un UPDATE con basura no puede tumbar el gráfico */ }
}

if (!window.__casparcg) { play(); }

</script>

</body>
</html>
