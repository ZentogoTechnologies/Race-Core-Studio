<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estado de la Carrera</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/totem_names.css">
    <link rel="stylesheet" href="../css/flags.css">
</head>

<body>

<div class="leaderboard">

    <div class="lb-header">

        <div class="lb-logo">
            <img src="../img/logo-cliente.png" alt="Autódromo Panamá">
        </div>

        <div class="lb-info-yellow">

            <div class="lb-heat flag safety">
                <svg class="sc-carro" viewBox="0 0 64 26" aria-hidden="true">
                    <!-- Silueta de coche de seguridad: techo, capo y las
                         dos luces de la barra superior. -->
                    <path d="M3 20h58a2 2 0 0 0 2-2v-4a4 4 0 0 0-3-3.9l-9-2.2-6.4-4.6A7 7 0 0 0 40.5 2H26a7 7 0 0 0-4.4 1.6L15 9.3l-9.6 1.6A4 4 0 0 0 2 14.8V18a2 2 0 0 0 1 2z"/>
                    <rect x="23" y="0" width="18" height="3.4" rx="1.2" class="sc-baliza"/>
                    <circle cx="15" cy="20.5" r="4.6"/>
                    <circle cx="49" cy="20.5" r="4.6"/>
                    <circle cx="15" cy="20.5" r="1.9" class="sc-llanta"/>
                    <circle cx="49" cy="20.5" r="1.9" class="sc-llanta"/>
                </svg>
                <span class="status-value">SAFETY CAR</span>
            </div>

        </div>

    </div>

</div>

<script src="../js/flags.js"></script>

</body>
</html>
