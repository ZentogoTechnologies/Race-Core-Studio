<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bandera a cuadros</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/torre_medidas.css">
    <link rel="stylesheet" href="../css/banderas.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>
<body>

<div class="bandera-barra" id="barra">

    <div class="bandera-logo">
        <img src="../img/logo-cliente.png" alt="">
    </div>

    <div class="bandera-panel cuadros" id="panel">
        <div class="bandera-caja"></div>
    </div>

</div>

<script>

/* ==========================================================================
   BANDERA A CUADROS

   El panel entero es la bandera: se despliega desde el logo y ocupa el
   resto de la franja con su color o su dibujo.

   Va sin texto. Una bandera se reconoce por su diseño y el rótulo repetía
   lo que ya se ve. El safety car es la excepción, porque ahí no hay una
   bandera reglamentaria que lo identifique.

   Mide lo mismo que la torre porque se dibuja sobre su cabecera: la
   medida sale de torre_medidas.css, que es de donde la toma el tótem.
========================================================================== */

function play(){
    document.getElementById("panel").classList.add("abierta");
}

function stop(){
    document.getElementById("panel").classList.remove("abierta");
}

function update(data){
    /* Solo el safety car lleva rótulo, así que solo él lo acepta al vuelo. */
    try {
        const d = typeof data === "string" ? JSON.parse(data) : (data || {});
        const rotulo = document.querySelector(".rotulo");

        if (d.texto && rotulo) rotulo.textContent = d.texto;
    } catch (e) { /* un UPDATE con basura no puede tumbar el gráfico */ }
}

if (!window.__casparcg) { play(); }

</script>

</body>
</html>
