<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Grilla de Partida</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/grilla.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>
<body>

    <div class="grilla" id="grilla">

        <div class="gr-cabecera">
            <div class="gr-logo"><img id="logo" src="../img/logo-cliente.png" alt=""></div>
            <div class="gr-titulos">
                <div class="gr-rotulo" id="rotulo">Autódromo Panamá</div>
                <div class="gr-titulo" id="titulo">Grilla de Partida</div>
            </div>
            <div class="gr-categoria" id="categoria"></div>
        </div>

        <div class="gr-columnas" id="columnas"></div>

        <div class="gr-paso" id="paso"></div>

    </div>

<script>

/* ==========================================================================
   GRILLA DE PARTIDA

   Una fila por posicion: numero, logo de la marca y apellido. Los datos
   llegan del backend ya cruzados con la base, porque el XML de MyLaps trae
   los nombres sin acentos y a veces abreviados, y la marca no la trae en
   absoluto: sale del vehiculo que lleva ese dorsal.
========================================================================== */

/* De diez en diez. Treinta carros a la vez salen tan apretados que no se
   leen en pantalla; de diez caben holgados y da tiempo a buscarse. */
const POR_PAGINA = 10;

/* Lo que tarda en pasar a la siguiente tanda. */
const ESPERA = 5000;

/* Lo que queda para las filas descontando la cabecera y los margenes,
   sobre los 1080 de la emision. */
const ALTO_DISPONIBLE = 790;

let parrilla = [];
let pagina   = 0;
let relevo   = null;

function escapar(t){
    return String(t == null ? "" : t)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

/* El apellido manda, como en cualquier parrilla: es lo que identifica al
   piloto de un vistazo. Si no viene, se cae al nombre completo. */
function nombreDeFila(p){
    const apellido = (p.last_name || "").trim();
    if (apellido) return apellido.toUpperCase();
    return (p.full_name || p.name || "").trim().toUpperCase();
}

function marca(p){
    if (p.brand_logo) return `<img src="${escapar(p.brand_logo)}" alt="">`;
    if (p.brand)      return `<span>${escapar(p.brand)}</span>`;
    return "";
}

function fila(p){
    const dorsal = p.number ? `<span class="gr-dorsal">#${escapar(p.number)}</span>` : "";

    return `<div class="gr-fila">`
         +   `<div class="gr-pos">${escapar(p.position)}</div>`
         +   `<div class="gr-marca">${marca(p)}</div>`
         +   `<div class="gr-nombre">${escapar(nombreDeFila(p))}${dorsal}</div>`
         + `</div>`;
}

function medir(filas){

    const caja = document.getElementById("grilla");
    if (!caja || !filas) return;

    const hueco = filas > 4 ? 15 : 20;

    /* Se cuenta media fila de mas: la columna de la derecha va bajada esa
       media fila, asi que la parrilla ocupa un poco mas de lo que suman
       las de la izquierda. */
    const alto = Math.max(48, Math.min(94,
        Math.floor(ALTO_DISPONIBLE / (filas + 0.5)) - hueco));

    caja.style.setProperty("--gr-fila-alto", alto + "px");
    caja.style.setProperty("--gr-hueco", hueco + "px");

    /* El cuerpo sigue al alto de la fila, no al reves: si la letra no
       encogiera con ella, el apellido se saldria de su caja. */
    caja.style.setProperty("--gr-cuerpo",     Math.round(alto * 0.38) + "px");
    caja.style.setProperty("--gr-cuerpo-pos", Math.round(alto * 0.38) + "px");
}

function cuantasPaginas(){
    return Math.max(1, Math.ceil(parrilla.length / POR_PAGINA));
}

/* El rotulo del pie dice por donde va y cuantos son en total: sin el, la
   grilla cambia sola y no se sabe si falta gente por salir. */
function pintarPaso(){

    const paso = document.getElementById("paso");
    if (!paso) return;

    if (parrilla.length <= POR_PAGINA) { paso.innerHTML = ""; return; }

    const desde = pagina * POR_PAGINA + 1;
    const hasta = Math.min(parrilla.length, desde + POR_PAGINA - 1);

    let puntos = "";
    for (let i = 0; i < cuantasPaginas(); i++)
        puntos += `<span class="gr-punto${i === pagina ? " activo" : ""}"></span>`;

    paso.innerHTML = `<span class="gr-rango">${desde} – ${hasta}`
                   + `<span class="gr-total"> ${T("grilla.de", "de")} ${parrilla.length}</span></span>`
                   + `<span class="gr-puntos">${puntos}</span>`;
}

function pintar(){

    const destino = document.getElementById("columnas");
    if (!destino) return;

    const lista = parrilla.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA);

    /* Impares a la izquierda y pares a la derecha, con la columna derecha
       bajada media fila. No es una lista partida por la mitad: es como se
       forman los carros en la recta de salida, en zigzag, y quien mira el
       grafico esta viendo la parrilla, no un listado. */
    const izquierda = lista.filter((_, i) => i % 2 === 0);
    const derecha   = lista.filter((_, i) => i % 2 === 1);

    medir(izquierda.length);

    destino.innerHTML =
          `<div class="gr-columna">`         + izquierda.map(fila).join("") + `</div>`
        + `<div class="gr-columna derecha">` + derecha.map(fila).join("")   + `</div>`;

    pintarPaso();

    /* La cascada se arranca aqui y no en el CSS: se recorre en el orden de
       salida y no por columnas, para que entren 1, 2, 3... */
    lista.forEach((_, i) => {
        const el = destino.children[i % 2].children[Math.floor(i / 2)];
        if (!el) return;
        el.style.animation = "filaEntra .34s ease forwards";
        el.style.animationDelay = (0.20 + i * 0.05) + "s";
    });
}

function pararRelevo(){
    if (relevo) { clearInterval(relevo); relevo = null; }
}

function arrancarRelevo(){

    pararRelevo();

    /* Con diez o menos no hay nada que relevar: cabe toda la parrilla. */
    if (parrilla.length <= POR_PAGINA) return;

    relevo = setInterval(() => {
        pagina = (pagina + 1) % cuantasPaginas();
        pintar();
    }, ESPERA);
}

function update(data){
    try{
        const d = typeof data === "string" ? JSON.parse(data) : (data || {});

        /* Solo si viene con algo. url_logo_cliente() manda cadena vacia
           cuando no hay logo propio subido en Ajustes, y escribirla
           encima borraba el de fabrica: el logo salia al empezar la
           animacion y desaparecia al llegar los datos. */
        if (d.logo) document.getElementById("logo").src = d.logo;
        if (d.subtitle  !== undefined) document.getElementById("rotulo").textContent = d.subtitle;
        if (d.title     !== undefined) document.getElementById("titulo").textContent = d.title;
        if (d.category  !== undefined) document.getElementById("categoria").textContent =
            (d.category || "").toUpperCase();

        if (d.drivers !== undefined) {
            parrilla = Array.isArray(d.drivers) ? d.drivers : [];
            pagina = 0;
            pintar();
            arrancarRelevo();
        }

    }catch(e){ /* un UPDATE con basura no puede tumbar el grafico */ }
}

function play(){
    document.getElementById("grilla").style.animation =
        "grillaEntra .5s ease forwards";
}

function stop(){
    /* Sin esto el intervalo sigue latiendo con el grafico fuera de aire. */
    pararRelevo();

    document.getElementById("grilla").style.animation =
        "grillaSale .4s ease forwards";
}

if (!window.__casparcg) { play(); }

</script>

</body>
</html>
