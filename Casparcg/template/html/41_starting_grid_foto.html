<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Starting Grid</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/starting_grid.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>

<body>

<div class="starting-grid" id="starting-grid">


    <!-- ==============================================================
         HEADER
    ============================================================== -->

    <div class="grid-header">

        <!-- LOGO -->
        <div class="grid-logo">

            <img
                id="logo"
                src="../img/logo-cliente.png"
                alt="Logo">

        </div>


        <!-- TITULOS -->
        <div class="grid-header-info">

            <div
                class="grid-title"
                id="title">
                STARTING GRID
            </div>

            <div
                class="grid-subtitle"
                id="subtitle">
                GRILLA DE PARTIDA
            </div>

        </div>

    </div>


    <!-- ==============================================================
         GRID
         
         JavaScript genera aquí las posiciones.
         Siempre se muestran 2 pilotos a la vez.
    ============================================================== -->

    <div
        class="grid-list"
        id="grid-list">
    </div>


</div>


<script>


/* ==========================================================================
   VARIABLES
========================================================================== */


/*
 * Todos los pilotos.
 */
let drivers = [];


/*
 * Pareja que se está mostrando actualmente.
 *
 * 0 = posiciones 1 y 2
 * 1 = posiciones 3 y 4
 * 2 = posiciones 5 y 6
 */
let currentPage = 0;


/*
 * Intervalo del carrusel.
 */
let carouselInterval = null;



/* ==========================================================================
   UPDATE
========================================================================== */

function update(data) {
    /* CasparCG 2.5 entrega el payload del CG ADD/UPDATE como texto JSON,
       no como objeto. Sin este parseo data.<campo> siempre era undefined
       y la plantilla se quedaba con sus valores por defecto. */

    if (typeof data === "string") {
        try { data = JSON.parse(data); }
        catch (e) { return; }
    }



    /* ======================================================================
       TITULO
    ====================================================================== */

    if(data.title !== undefined){

        document.getElementById("title").textContent =
            data.title.toUpperCase();

    }


    /* ======================================================================
       SUBTITULO
    ====================================================================== */

    if(data.subtitle !== undefined){

        document.getElementById("subtitle").textContent =
            data.subtitle.toUpperCase();

    }


    /* ======================================================================
       LOGO
    ====================================================================== */

    if(data.logo !== undefined){

        document.getElementById("logo").src =
            data.logo;

    }


    /* ======================================================================
       PILOTOS
    ====================================================================== */

    if(data.drivers !== undefined){

        /*
         * Guardamos la data.
         */
        drivers = data.drivers;


        /*
         * Empezamos desde la primera pareja.
         */
        currentPage = 0;


        /*
         * Iniciamos el carrusel.
         */
        startCarousel();

    }

}



/* ==========================================================================
   MOSTRAR PAREJA ACTUAL
========================================================================== */

function showPage() {


    const grid =
        document.getElementById("grid-list");


    /*
     * Limpiar la pareja anterior.
     */
    grid.innerHTML = "";


    /*
     * Cada página contiene 2 pilotos.
     */
    const start =
        currentPage * 2;


    /*
     * Obtener máximo 2 pilotos.
     */
    const pageDrivers =
        drivers.slice(start, start + 2);


    /*
     * Crear fila.
     */
    const row =
        document.createElement("div");

    row.className =
        "grid-row";


    /*
     * Crear las tarjetas.
     */
    pageDrivers.forEach(driver => {


        const card =
            document.createElement("div");

        card.className =
            "driver-card";


        card.innerHTML = `

            <div class="position">
                ${driver.position}
            </div>


            <div class="driver-photo">

                <img
                    src="${driver.photo}"
                    alt="${driver.name}">

            </div>


            <div class="driver-info">

                <div class="driver-name">
                    ${driver.name}
                </div>

                <div class="driver-number">
                    #${driver.number}
                </div>

            </div>

        `;


        row.appendChild(card);

    });


    /*
     * Mostrar la fila.
     */
    grid.appendChild(row);

}



/* ==========================================================================
   PLAY
========================================================================== */

function play() {

    /*
     * Inicia el carrusel.
     */
    startCarousel();

}



/* ==========================================================================
   STOP
========================================================================== */

function stop() {

    /*
     * Detiene el carrusel.
     */
    clearInterval(carouselInterval);

}



/* ==========================================================================
   CARRUSEL
========================================================================== */

function startCarousel() {


    /*
     * Evitar que existan varios intervalos
     * funcionando al mismo tiempo.
     */
    clearInterval(carouselInterval);


    /*
     * Si no hay pilotos, no hacer nada.
     */
    if(drivers.length === 0){

        return;

    }


    /*
     * Mostrar inmediatamente
     * la primera pareja.
     */
    showPage();


    /*
     * Si hay solamente 1 o 2 pilotos,
     * no necesitamos carrusel.
     */
    if(drivers.length <= 2){

        return;

    }


    /*
     * Cambiar de pareja cada 3 segundos.
     */
    carouselInterval = setInterval(() => {


        /*
         * Siguiente pareja.
         */
        currentPage++;


        /*
         * Número total de páginas.
         */
        const totalPages =
            Math.ceil(drivers.length / 2);


        /*
         * Si llegamos al final,
         * volver a la primera pareja.
         */
        if(currentPage >= totalPages){

            currentPage = 0;

        }


        /*
         * Mostrar nueva pareja.
         */
        showPage();


    }, 3000);

}



/* ==========================================================================
   DATOS DE PRUEBA
========================================================================== */

update({

    title: "Starting Grid",

    subtitle: "Grilla de Partida",

    logo: "../img/logo-cliente.png",


    drivers: [

        {
            position: 1,
            name: "PILOTO 1",
            number: 1,
            photo: "../img/pilot.png"
        },

        {

            number: 2,
            photo: "../img/pilot.png"
        },

        {
            position: 3,

            number: 3,
            photo: "../img/pilot.png"
        },

        {
            position: 4,
            name: "PILOTO 4",
            number: 4,
            photo: "../img/pilot.png"
        },

        {
            position: 5,
            name: "PILOTO 5",
            number: 5,
            photo: "../img/pilot.png"
        },

        {
            position: 6,
            name: "PILOTO 6",
            number: 6,
            photo: "../img/pilot.png"
        },

        {
            position: 7,
            name: "PILOTO 7",
            number: 7,
            photo: "../img/pilot.png"
        },

        {
            position: 8,
            name: "PILOTO 8",
            number: 8,
            photo: "../img/pilot.png"
        },

        {
            position: 9,
            name: "PILOTO 9",
            number: 9,
            photo: "../img/pilot.png"
        },

        {
            position: 10,
            name: "PILOTO 10",
            number: 10,
            photo: "../img/pilot.png"
        },

        {
            position: 11,
            name: "PILOTO 11",
            number: 11,
            photo: "../img/pilot.png"
        },

        {
            position: 12,
            name: "PILOTO 12",
            number: 12,
            photo: "../img/pilot.png"
        },

        {
            position: 13,
            name: "PILOTO 13",
            number: 13,
            photo: "../img/pilot.png"
        },

        {
            position: 14,
            name: "PILOTO 14",
            number: 14,
            photo: "../img/pilot.png"
        },

        {
            position: 15,
            name: "PILOTO 15",
            number: 15,
            photo: "../img/pilot.png"
        }

    ]

});

</script>

</body>

</html>
