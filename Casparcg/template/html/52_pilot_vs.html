<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carta VS</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/pilot_vs.css">
</head>
<body>

    <div class="vs-card" id="vsCard">

        <div class="vs-lado izq">
            <div class="vs-foto"><img id="fotoA" src="" alt=""></div>
            <div class="vs-datos">
                <div class="vs-nombre-fila">
                    <span class="vs-nombre" id="nombreA">ROBERTO REYNA</span>
                    <span class="vs-dorsal" id="dorsalA">#17</span>
                </div>
                <div class="vs-carro" id="carroA">
                    <span class="marca">HONDA</span> CIVIC TYPE R
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo">Mejor</span> <span id="mejorA">1:23.456</span>
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo">Última</span> <span id="ultimaA">1:24.902</span>
                </div>
            </div>
        </div>

        <div class="vs-centro"><span></span></div>

        <div class="vs-lado der">
            <div class="vs-foto"><img id="fotoB" src="" alt=""></div>
            <div class="vs-datos">
                <div class="vs-nombre-fila">
                    <span class="vs-nombre" id="nombreB">LUIS MOTO MOTO</span>
                    <span class="vs-dorsal" id="dorsalB">#69</span>
                </div>
                <div class="vs-carro" id="carroB">
                    <span class="marca">TOYOTA</span> COROLLA GR
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo">Mejor</span> <span id="mejorB">1:23.918</span>
                </div>
                <div class="vs-tiempo">
                    <span class="rotulo">Última</span> <span id="ultimaB">1:24.115</span>
                </div>
            </div>
        </div>

    </div>

<script>
function txt(id,v){ const e=document.getElementById(id); if(e&&v!==undefined) e.textContent=v; }

function carro(id, marca, modelo){
    const e=document.getElementById(id); if(!e) return;
    const m=(marca||"").toUpperCase(), mo=(modelo||"").toUpperCase();
    e.innerHTML = m ? `<span class="marca">${m}</span> ${mo}` : mo;
}

function foto(id,url){
    const e=document.getElementById(id); if(!e||url===undefined) return;
    if(url){ e.src=url; e.style.visibility="visible"; }
    else   { e.removeAttribute("src"); e.style.visibility="hidden"; }
}

function nombre(n,a){ return [n,a].filter(Boolean).join(" ").toUpperCase(); }

function update(data){
    try{
        const d = typeof data==="string" ? JSON.parse(data) : (data||{});
        for(const s of ["a","b"]){
            const S=s.toUpperCase();
            if(d["name_"+s]!==undefined||d["last_name_"+s]!==undefined)
                txt("nombre"+S, nombre(d["name_"+s], d["last_name_"+s]));
            if(d["number_"+s]!==undefined)
                txt("dorsal"+S, d["number_"+s] ? "#"+d["number_"+s] : "");
            if(d["brand_"+s]!==undefined||d["model_"+s]!==undefined)
                carro("carro"+S, d["brand_"+s], d["model_"+s]);
            /* Sin cronometraje se pone un guion y no se deja en blanco:
               un hueco vacio parece que la carta se rompio. */
            if(d["best_time_"+s]!==undefined) txt("mejor"+S, d["best_time_"+s] || "--");
            if(d["last_time_"+s]!==undefined) txt("ultima"+S, d["last_time_"+s] || "--");
            foto("foto"+S, d["photo_"+s]);
        }
    }catch(e){}
}

/* La carta entra entera: aqui no hay un panel que se despliegue desde un
   logo, los dos lados pesan lo mismo. */
function play(){
    const c=document.getElementById("vsCard");
    c.style.transform="translateX(-50%)";
    c.style.animation="slideUp .5s ease forwards";
}
function stop(){
    document.getElementById("vsCard").style.animation="slideDown .5s ease forwards";
}

if(!window.__casparcg){ play(); }
</script>

</body>
</html>
