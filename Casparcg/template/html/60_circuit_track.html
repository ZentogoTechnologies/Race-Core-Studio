<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Circuit Track</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/circuit_track.css">

</head>

<body>

    <div
        class="circuit-card"
        id="circuitCard">


        <!-- ==============================================================
             HEADER
        ============================================================== -->

        <div class="circuit-header">

            <div class="circuit-logo">

                <img
                    id="trackLogo"
                    src="../img/logoap.png"
                    alt="Autódromo Panamá">

            </div>

            <div class="circuit-titles">

                <div
                    class="circuit-label"
                    id="circuitLabel">

                    CIRCUITO

                </div>

                <div
                    class="circuit-name"
                    id="circuitName">

                    AUTÓDROMO PANAMÁ

                </div>

            </div>

        </div>


        <!-- ==============================================================
             IMAGEN DE LA PISTA
        ============================================================== -->

        <div class="circuit-body">

            <img
                id="circuitImage"
                class="circuit-image"
                src="../img/circuit.jpg"
                alt="Trazado del circuito">

        </div>


    </div>

<script>

/* ==========================================================================
   UPDATE
========================================================================== */

function update(data){

    if(data.circuit_name !== undefined)
        document.getElementById("circuitName").textContent =
            data.circuit_name.toUpperCase();

    if(data.label !== undefined)
        document.getElementById("circuitLabel").textContent =
            data.label.toUpperCase();

    if(data.circuit_image !== undefined)
        document.getElementById("circuitImage").src =
            data.circuit_image;

    if(data.track_logo !== undefined)
        document.getElementById("trackLogo").src =
            data.track_logo;
}


/* ==========================================================================
   PLAY
========================================================================== */

function play(){

    document.getElementById("circuitCard").style.animation =
        "circuitIn .6s ease forwards";
}


/* ==========================================================================
   STOP
========================================================================== */

function stop(){

    document.getElementById("circuitCard").style.animation =
        "circuitOut .5s ease forwards";
}


/* ==========================================================================
   CARGA
========================================================================== */

window.onload = function(){

    play();
};

</script>

</body>
</html>
