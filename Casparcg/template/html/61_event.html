<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Event</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/event.css">

</head>

<body>

    <div
        class="overlay"
        id="overlay">

        <!-- PANEL LOGO -->

        <div class="logo-box">

            <img
                id="logo"
                src="../img/logoap.png"
                alt="Autódromo Panamá">

        </div>

        <!-- PANEL INFORMACIÓN -->

        <div
            class="info-panel"
            id="eventPanel">

            <div class="content-section">

                <div
                    class="event-label"
                    id="label">

                    EVENTO

                </div>

                <div
                    class="event-name"
                    id="eventName">

                    PROSPEC - SERIES

                </div>

            </div>

        </div>

    </div>

<script>

function update(data){

    if(data.label !== undefined)
        document.getElementById("label").textContent =
            data.label.toUpperCase();

    if(data.event !== undefined)
        document.getElementById("eventName").textContent =
            data.event.toUpperCase();

    if(data.logo !== undefined)
        document.getElementById("logo").src =
            data.logo;
}

function play(){

    const widget =
        document.getElementById("overlay");

    const panel =
        document.getElementById("eventPanel");

    widget.style.animation =
        "slideUp .5s ease forwards";

    setTimeout(() => {

        panel.style.animation =
            "expandPanel .6s ease forwards";

    },500);
}

function stop(){

    const widget =
        document.getElementById("overlay");

    const panel =
        document.getElementById("eventPanel");

    panel.style.animation =
        "collapsePanel .5s ease forwards";

    setTimeout(() => {

        widget.style.animation =
            "slideDown .5s ease forwards";

    },500);
}

window.onload = function(){

    play();
};

</script>

</body>
</html>
