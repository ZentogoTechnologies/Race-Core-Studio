<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado de la Pasada</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/drag_resultado.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>
<body>

    <div class="dr" id="dr">

        <div class="dr-cabecera">
            <div class="dr-ronda" id="ronda">Octavos de final</div>
            <div class="dr-titulo" id="titulo" data-t="drag.resultado">Resultado de la pasada</div>
        </div>

        <div class="dr-carriles" id="carriles"></div>

    </div>

<script>

/* ==========================================================================
   RESULTADO DE LA PASADA

   En drag cada pasada se cuenta sola: no hay clasificacion que actualizar
   ni vueltas que contar. Lo que decide son tres cifras por carril —la
   reaccion, el tiempo y la velocidad— y quien cruzo primero.

   Los datos llegan del panel. Race America puede exportarlos o no; si
   exporta, se conecta y este arte no cambia.
========================================================================== */

function escapar(t){
    return String(t == null ? "" : t)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

function carro(c){
    const marca  = (c.brand || "").trim().toUpperCase();
    const modelo = (c.model || "").trim().toUpperCase();
    if (!marca && !modelo) return "";
    return marca
        ? `<span class="marca">${escapar(marca)}</span> ${escapar(modelo)}`
        : escapar(modelo);
}

/* Una cifra del carril. `falta` la pinta en rojo: una salida quemada no es
   un tiempo malo, es descalificacion, y no puede leerse como una cifra
   mas de la fila. */
function cifra(rotulo, valor, unidad, clase){
    const texto = (valor == null || valor === "") ? "--" : escapar(valor);
    const uni = (unidad && texto !== "--")
        ? `<span class="unidad">${escapar(unidad)}</span>` : "";
    return `<div class="dr-cifra ${clase || ""}">`
         +   `<span class="rotulo">${escapar(rotulo)}</span>`
         +   `<span class="valor">${texto}${uni}</span>`
         + `</div>`;
}

function carril(c){

    if (!c) return `<div class="dr-carril"></div>`;

    const nombre = [c.name, c.last_name].filter(Boolean).join(" ").toUpperCase();
    const dorsal = c.number ? `<div class="dr-dorsal">${escapar(c.number)}</div>` : "";

    /* Quemar la salida es reaccion negativa: se marca en rojo porque
       significa descalificado, no lento. */
    const quemada = String(c.rt || "").trim().startsWith("-");

    return `<div class="dr-carril${c.gana ? " gana" : ""}">`
         +   `<div class="dr-quien">`
         +     dorsal
         +     `<div class="dr-nombre">${escapar(nombre)}</div>`
         +   `</div>`
         +   `<div class="dr-carro">${carro(c)}</div>`
         +   `<div class="dr-cifras">`
         +     cifra(T("drag.reaccion", "Reacción"), c.rt, "", quemada ? "falta" : "")
         +     cifra(T("drag.tiempo", "Tiempo"), c.et, "s", "et")
         +     cifra(T("drag.velocidad", "Velocidad"), c.speed, c.unidad || "km/h")
         +   `</div>`
         + `</div>`;
}

function pintar(carriles){

    const destino = document.getElementById("carriles");
    if (!destino) return;

    const dos = Array.isArray(carriles) ? carriles : [];
    destino.innerHTML = carril(dos[0]) + carril(dos[1]);

    /* Cada carril entra desde su lado. Se arranca aqui porque los nodos
       acaban de nacer: puesto en el CSS no se veria al refrescar. */
    const nodos = destino.querySelectorAll(".dr-carril");
    if (nodos[0]) nodos[0].style.animation = "drCarrilIzq .5s ease forwards";
    if (nodos[1]) nodos[1].style.animation = "drCarrilDer .5s ease forwards";
}

function update(data){
    try{
        const d = typeof data === "string" ? JSON.parse(data) : (data || {});

        if (d.ronda  !== undefined) document.getElementById("ronda").textContent = d.ronda;
        if (d.title  !== undefined) document.getElementById("titulo").textContent = d.title;

        if (d.carriles !== undefined) pintar(d.carriles);

    }catch(e){ /* un UPDATE con basura no puede tumbar el grafico */ }
}

function play(){
    document.getElementById("dr").style.animation = "drEntra .5s ease forwards";
}

function stop(){
    document.getElementById("dr").style.animation = "drSale .4s ease forwards";
}

if (!window.__casparcg) { play(); }

</script>

</body>
</html>
