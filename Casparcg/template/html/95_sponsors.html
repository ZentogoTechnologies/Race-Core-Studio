<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Patrocinadores</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/patrocinadores.css">
    <script src="../js/idioma_activo.js"></script>
    <script src="../js/i18n.js"></script>
</head>
<body>

<div class="pa-caja" id="patrocinio">

    <!-- Quemado arriba y fijo mientras los de abajo rotan. Sale del
         mismo archivo que el de los demás gráficos, así que cambiarlo
         en Ajustes lo cambia también aquí. -->
    <img class="pa-logo" id="logo" src="../img/logo-cliente.png" alt="">

    <div class="pa-rotacion" id="rotacion"></div>

</div>

<script src="../js/origen.js"></script>
<script src="../js/patrocinadores.js"></script>
<script>

/* ==========================================================================
   PATROCINADORES

   La mosca de la esquina. Es el gráfico que se queda puesto el evento
   entero, por eso tiene capa propia: compartiéndola, sacar cualquier
   otro gráfico lo tumbaría.

   No recibe la lista de logos al salir al aire. La pide él solo y la
   vuelve a pedir cada medio minuto, así un patrocinador subido a mitad
   de evento entra en la rotación sin tener que bajar el gráfico.

   Todo el comportamiento vive en js/patrocinadores.js.
========================================================================== */


function play(){

    arrancarPatrocinio({});
}


function stop(){

    detenerPatrocinio();
}


function update(data){

    actualizarPatrocinio(data);
}


/* Fuera de CasparCG (abriendo el html a mano) no hay play(), así que se
   arranca solo para poder verlo en el navegador. */
if (!window.__casparcg) {
    play();
}

</script>

</body>
</html>
